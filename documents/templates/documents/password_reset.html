{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | LifeLedger</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'documents/style.css' %}">
</head>
<body>
    
    <div class="auth-container">
        <div class="auth-card">
            <h1>LifeLedger</h1>
            <h2>Forgot Password?</h2>

            <p class="auth-description">No worries! Enter your registerd email address. 
                We'll send you a secure link to reset your password.</p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">Send Reset Link</button>
            </form>

            <p class="register-link">Remember your password?<a href="{% url 'login' %}">Back to Login</a></p>
        </div>
    </div>
</body>
</html>
